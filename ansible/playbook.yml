---
- name: Install dependencies and deploy Kubernetes resources to Minikube (VPS)
  hosts: vps
  become: true
  gather_facts: true

  vars:
    k8s_dir: "{{ playbook_dir }}/../k8s"

    kubectl_bin: /usr/local/bin/kubectl
    minikube_bin: /usr/local/bin/minikube
    kubeconfig: /root/.kube/config

  tasks:
    - name: Ensure required packages are installed
      package:
        name:
          - curl
          - conntrack
        state: present

    - name: Check kubectl exists
      stat:
        path: "{{ kubectl_bin }}"
      register: kubectl_stat

    - name: Download kubectl if missing
      when: not kubectl_stat.stat.exists
      get_url:
        url: https://dl.k8s.io/release/v1.35.0/bin/linux/amd64/kubectl
        dest: "{{ kubectl_bin }}"
        mode: '0755'

    # setup kubectl
    - name: Check minikube exists
      stat:
        path: "{{ minikube_bin }}"
      register: minikube_stat

    - name: Download minikube if missing
      when: not minikube_stat.stat.exists
      get_url:
        url: https://storage.googleapis.com/minikube/releases/latest/minikube-linux-amd64
        dest: "{{ minikube_bin }}"
        mode: '0755'

    # setup podman
    - name: Check podman exists
      command: podman --version
      register: podman_check
      failed_when: false
      changed_when: false

    - name: Install podman (if missing)
      package:
        name: podman
        state: present
      when: podman_check.rc != 0

    - name: Enable podman socket (for compatibility)
      service:
        name: podman.socket
        state: started
        enabled: true
      when: podman_check.rc == 0 or podman_check is defined

    # setup minikube
    - name: Check Minikube status
      command: minikube status --format='{{ "{{.Host}}" }}'
      register: minikube_status
      failed_when: false
      changed_when: false

    - name: Start Minikube (docker driver)
      command: minikube start --driver=podman
      when: "'Running' not in minikube_status.stdout"

    # deploy kubernetes
    - name: Apply namespace
      command: kubectl apply -f {{ k8s_dir }}/namespace.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply configmap
      command: kubectl apply -f {{ k8s_dir }}/configmap.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply secret (optional)
      command: kubectl apply -f {{ k8s_dir }}/secret.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      ignore_errors: true

    - name: Apply deployment
      command: kubectl apply -f {{ k8s_dir }}/deployment.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Apply service
      command: kubectl apply -f {{ k8s_dir }}/service.yaml
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    # verifikasi
    - name: Wait for pods to be ready
      command: >
        kubectl wait
        --for=condition=Ready pod
        --all
        -n tubes-devops
        --timeout=120s
      environment:
        KUBECONFIG: "{{ kubeconfig }}"

    - name: Show deployed resources
      command: kubectl get all -n tubes-devops
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
